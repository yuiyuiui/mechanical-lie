name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  wheel-tests:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build isolated wheel and source distribution
        run: |
          python -m pip install build==1.3.0 sympy==1.14.0
          python -m build
          python -m pip install --no-deps dist/mechanical_lie-0.2.1-py3-none-any.whl
      - name: Check installed import and independent regressions
        run: |
          python -c "import mechanical_lie; assert 'site-packages' in mechanical_lie.__file__; assert mechanical_lie.__version__ == '0.2.1'"
          python -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v
          python examples/quartic.py
          python examples/parameters.py
      - name: Build from source distribution
        run: python -m pip wheel --no-deps --wheel-dir dist/sdist-check dist/mechanical_lie-0.2.1.tar.gz

  figures-and-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install ".[figures,test]" ruff==0.14.0
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Recompute finite cases and both figure formats
        run: |
          python numerical_case/compute_cases.py --output numerical_case/results/ci
          python numerical_case/plot_cases.py --data numerical_case/results/ci --output numerical_case/results/ci/figures
          python numerical_case/check_outputs.py --data numerical_case/results/ci --figures numerical_case/results/ci/figures
      - name: Matched default and explicit policy smoke benchmark
        run: |
          python bench/benchmark_policies.py --output numerical_case/results/ci-bench --repeats 1
          python bench/check_results.py numerical_case/results/ci-bench/results.json

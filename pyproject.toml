[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanical-lie"
version = "0.1.0"
description = "Exact symbolic tree and Poisson brackets for Euclidean mechanical Hamiltonians"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Kaiwen Jin", email = "yui.ui.siki@gmail.com"}]
keywords = ["Poisson bracket", "Hamiltonian", "Lie algebra", "geometric integration", "symbolic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["sympy==1.14.0"]
figures = ["matplotlib==3.10.7"]
dev = ["build==1.3.0", "ruff==0.14.0", "sympy==1.14.0", "matplotlib==3.10.7"]

[project.urls]
Repository = "https://github.com/yuiyuiui/mechanical-lie"
Documentation = "https://github.com/yuiyuiui/mechanical-lie/tree/main/docs"
Issues = "https://github.com/yuiyuiui/mechanical-lie/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechanical_lie = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/test_engine_regression.py" = ["E402"]
"numerical_case/plot_cases.py" = ["E402"] # Thread/backend caps precede plotting imports.
